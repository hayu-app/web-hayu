<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Hayu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font: 16px/1.5 system-ui, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    main {
      max-width: 560px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 24px #0000000d;
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #ccd2d8;
      border-radius: 9px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      border: 0;
      background: #1769e0;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #465365; }
    .note { color: #586575; font-size: 14px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js" defer></script>
</head>
<body>
<main>
  <h1>Admin Hayu</h1>
  <p class="note">Kelola versi aplikasi, URL APK, dan catatan rilis.</p>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="login-section">
    <h2>Masuk admin</h2>
    <form id="login-form">
      <label for="email">Email admin</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="login-button" type="submit">Masuk</button>
    </form>
  </section>

  <section id="panel" hidden>
    <h2>Informasi rilis</h2>
    <form id="release-form">
      <label for="version">Versi aplikasi</label>
      <input id="version" required placeholder="1.0.1">

      <label for="download_url">URL unduhan APK</label>
      <input id="download_url" type="url" required
        placeholder="https://github.com/.../app-debug.apk">

      <label for="storage_path">Storage path (opsional)</label>
      <input id="storage_path" placeholder="Kosongkan jika tidak dipakai">

      <label for="notes">Catatan rilis</label>
      <textarea id="notes"
        placeholder="Perbaikan bug dan fitur baru"></textarea>

      <button id="save-button" type="submit">Simpan perubahan</button>
    </form>

    <button id="logout" class="secondary" type="button">Keluar</button>
  </section>
</main>
</body>
</html>
